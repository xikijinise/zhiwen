<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>职问</title>
  <meta name="description" content="职问">
  <link rel="icon" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell" id="shell">
    <div class="scrim" id="scrim" hidden></div>
    <div class="side-peer" id="side" data-slot="sidebar" data-state="expanded" data-collapsible="" data-side="left">
      <aside class="side-col" data-slot="sidebar-inner">
        <div class="brand-wrap">
          <div class="brand-row">
            <a href="/" class="brand" aria-label="职问首页"><span class="brand-icon" id="brand-icon"></span><span>职问</span></a>
            <button class="sidebar-hide" id="hide-side" type="button" aria-label="隐藏侧栏"></button>
          </div>
          <button class="new-chat" id="new-chat" type="button">开始新对话</button>
        </div>
        <nav class="nav-content" id="nav"></nav>
      </aside>
    </div>
    <main class="workspace">
      <header class="topbar">
        <div class="topbar-title"><button class="sidebar-toggle" id="show-side" type="button" aria-label="显示侧栏"></button></div>
        <div class="topbar-right"><button class="source-trigger" id="open-sources" type="button" aria-label="官方依据"></button></div>
      </header>
      <div class="conversation-scroll" id="scroller"></div>
      <section class="composer-wrap">
        <div class="context-row">
          <div class="identity-control"><span id="id-icon"></span>
            <select id="identity" class="context-select" aria-label="选择当前身份">
              <option value="unspecified">身份未选择</option>
              <option value="student">在校大学生</option>
              <option value="graduating">毕业年级 / 待入职</option>
              <option value="employed">已毕业 / 正式工作</option>
            </select>
          </div>
          <label class="city-control"><span id="pin-icon"></span><input id="city" aria-label="工作城市（可选）" maxlength="30" placeholder="工作城市（可选）"></label>
        </div>
        <form class="composer is-compact" id="composer">
          <label class="sr-only" for="question-input">输入问题</label>
          <textarea id="question-input" placeholder="输入问题" maxlength="1800" rows="1"></textarea>
          <div class="composer-bottom">
            <button class="send-button" id="send" type="submit" disabled><span>发送</span></button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <aside class="sources-sheet" role="dialog" aria-label="官方依据">
      <div class="sheet-head">
        <h2 class="sheet-title"><span id="landmark-icon"></span>官方依据</h2>
        <button class="sheet-close" id="close-sheet" type="button" aria-label="关闭">×</button>
      </div>
      <div class="source-library" id="source-library"></div>
    </aside>
  </div>
  <script id="boot" type="application/json">/*BOOT*/</script>
  <script src="/static/app.js"></script>
</body>
</html>
